<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>源鉴</title><link rel="icon" href="data:,"><style>
:root{font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#173d38;background:#f1f7f5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #bdd0ca;border-radius:6px;padding:7px 16px;background:white;color:#235a52}button:hover{background:#e4f1ec}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #087e73;outline-offset:3px}.primary{background:#087e73;color:white;border-color:#087e73}.primary:hover{background:#06685f}.bar{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#e8f1ed;border-bottom:1px solid #c9dbd4}.bar button{padding:2px 14px;font-size:13px}.status{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#8d9d96}.dot.ready{background:#16855a}.dot.error{background:#b64c3c}#workbench{position:absolute;top:43px;width:100%;height:calc(100vh - 43px);border:0;background:white}#welcome{max-width:780px;margin:15vh auto;padding:0 30px}h1{font-size:32px;letter-spacing:.03em;margin:0 0 8px}h2{font-size:23px;margin:0 0 4px}h3{font-size:15px;margin:0 0 14px}.muted{color:#60776f;font-size:13px}.progress{height:4px;border-radius:4px;background:#d5e6df;margin:24px 0 14px;overflow:hidden}.progress:after{content:"";display:block;width:40%;height:100%;background:#178b7d;animation:preparing 1.8s ease-in-out infinite}@keyframes preparing{from{transform:translateX(-110%)}to{transform:translateX(350%)}}@media(prefers-reduced-motion:reduce){.progress:after{animation:none}}#boot-message{white-space:pre-line;font-size:16px}.actions{display:flex;gap:10px;margin-top:22px}#settings[hidden],#workbench[hidden],#welcome[hidden],#retry[hidden],#loading[hidden]{display:none}#settings{position:fixed;inset:43px 0 0;background:rgba(231,240,235,.88);overflow:auto;z-index:3;padding:25px}.sheet{width:min(880px,100%);margin:0 auto;background:#fff;border:1px solid #c8dad2;border-radius:10px;box-shadow:0 15px 50px #27493b16;padding:25px 30px}.settings-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.section{border-top:1px solid #e1eae5;padding:19px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 20px}label{display:block;color:#214d43;font-size:13px}input{display:block;width:100%;padding:9px 10px;border:1px solid #bed1c8;background:#fbfdfc;border-radius:5px;color:#173d38;margin-top:5px}input[type=checkbox]{display:inline;width:auto;margin:0 7px 0 0;vertical-align:middle}.browse{display:flex;gap:7px;align-items:end}.browse input{min-width:0}.browse button{white-space:nowrap;padding:9px}.full{grid-column:1/-1}.hint{font-size:12px;color:#6b8177;margin-top:5px}.data-line{display:flex;gap:15px;align-items:center;justify-content:space-between}.path{word-break:break-all;color:#526d61;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:12px}.message{white-space:pre-line;color:#75552b;font-size:13px}.error-message{color:#a1382d}.key-state{color:#187b64}.check{margin-top:10px}.brand-mark{color:#087e73;margin-bottom:16px;font-size:18px;font-weight:600}.small{font-size:12px}
.enhancement-option{display:flex;align-items:flex-start;gap:10px;margin:12px 0}.enhancement-option input{width:18px;height:18px;margin:2px 0 0;flex-shrink:0;accent-color:#087e73}.enhancement-option strong{display:block;font-weight:600}.enhancement-option .hint{display:block;margin-top:2px}
</style></head><body>
<header class="bar"><div class="status" role="status"><span class="dot" id="dot"></span><span id="top-status">正在打开源鉴</span></div><button id="open-settings">设置</button></header>
<main id="welcome"><div class="brand-mark">&lt;/&gt; 源鉴</div><h1>每一次解释，都源于源码。</h1><p class="muted">准备本地资源后，继续你的源码阅读。</p><div class="progress" id="loading"></div><p id="boot-message" role="status">正在检查本地资源</p><div class="actions"><button class="primary" id="boot-settings">打开设置</button><button id="retry" hidden>重试启动</button></div></main>
<iframe id="workbench" title="源鉴源码工作台" hidden></iframe>
<section id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><form class="sheet" id="settings-form">
<div class="settings-head"><div><h2 id="settings-title">设置</h2><div class="muted">本地资源与生成模型。仅保存在本轮独立用户目录。</div></div><button type="button" id="close-settings">返回</button></div>
<div class="section"><h3>本地资源</h3><div class="grid"><label>BGE-M3 模型目录<div class="browse"><input id="model-directory" autocomplete="off" placeholder="选择已下载的完整权重目录"><button type="button" data-browse="model_directory">选择</button></div></label><label>Git 程序或安装目录<div class="browse"><input id="git-directory" autocomplete="off" placeholder="git.exe 或 Git 安装目录"><button type="button" data-browse="git_directory">选择</button></div></label></div><div class="hint" id="device-hint"></div></div>
<div class="section"><h3>生成 API</h3><div class="grid"><label>API 地址<input id="api-base" type="url" autocomplete="off" placeholder="https://你的服务商/v1"></label><label>模型名称<input id="api-model" autocomplete="off" placeholder="服务商提供的模型名称"></label><label class="full">API Key<input id="api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="输入新密钥；留空保留已保存密钥"><div class="hint" id="key-state">尚未保存密钥。源码阅读与探索不需要生成 API。</div></label></div><label class="check small"><input type="checkbox" id="clear-key">清除已保存的密钥</label><div class="hint">密钥按当前 Windows 用户加密保存，不回显。保存设置不会进行连通检测或生成调用。</div></div>
<div class="section" aria-labelledby="enhancement-title"><h3 id="enhancement-title">检索增强</h3>
<label class="enhancement-option"><input type="checkbox" id="hyde-enabled" aria-describedby="hyde-help"><span><strong>HyDE 辅助检索</strong><span class="hint" id="hyde-help">先生成一段假设性内容，帮助寻找相关源码；假设内容不会作为回答依据。</span></span></label>
<label class="enhancement-option"><input type="checkbox" id="rerank-enabled" aria-describedby="rerank-help"><span><strong>检索结果重排序</strong><span class="hint" id="rerank-help">重新判断候选源码与问题的相关性，优先选取更相关的内容。</span></span></label>
<div class="hint">开启后可能增加模型调用和等待时间。实际执行结果请查看每次回答的执行摘要。</div></div>
<div class="section"><h3>数据位置</h3><div class="data-line"><div class="path" id="data-directory"></div><button type="button" id="open-data">打开数据目录</button></div></div>
<div class="footer"><div class="message" id="save-message" role="status">更改将重启本地服务，请在回答结束后保存。</div><button class="primary" type="submit" id="save-settings">保存并应用</button></div>
</form></section>
<script>
const $=id=>document.getElementById(id);let api=null,settingsLoaded=false,frameGeneration=-1,lastPhase='',polling=false,applyFromGeneration=-1;
function lockInputs(locked){document.querySelectorAll('#settings-form input,[data-browse]').forEach(el=>el.disabled=locked);$('save-settings').disabled=locked;}
async function showSettings(){
  $('settings').hidden=false;
  if($('save-message').dataset.applying!=='true')$('save-message').textContent='更改将重启本地服务，请在回答结束后保存。';
  if(await loadSettings())$('model-directory').focus();
}
function fillSettings(s){$('model-directory').value=s.model_directory||'';$('git-directory').value=s.git_directory||'';$('api-base').value=s.api_base||'';$('api-model').value=s.api_model||'';$('api-key').value='';$('clear-key').checked=false;$('hyde-enabled').checked=s.hyde_enabled===true;$('rerank-enabled').checked=s.rerank_enabled===true;$('data-directory').textContent=s.data_directory;$('device-hint').textContent=`当前设备：${s.device}，批量：${s.batch_size}，最大长度：${s.max_length}。沿用已验证配置。`;$('key-state').textContent=s.key_saved?'已保存密钥；留空保留，输入新值可替换。':'尚未保存密钥。源码阅读与探索不需要生成 API。';$('key-state').className=s.key_saved?'hint key-state':'hint';settingsLoaded=true;}
async function loadSettings(){
  settingsLoaded=false;lockInputs(true);
  try{fillSettings(await api.get_settings());lockInputs(false);return true;}
  catch{$('save-message').textContent='无法读取设置，未应用任何更改。请返回后重新打开设置。';$('save-message').className='message error-message';return false;}
}
function render(s){$('top-status').textContent=s.phase==='ready'?(s.api_ready?'本地服务已就绪':'本地服务已就绪 · 生成 API 未配置'):s.message.split('\n')[0];$('dot').className='dot '+(s.phase==='ready'?'ready':s.phase==='error'?'error':'');$('boot-message').textContent=s.message;$('loading').hidden=['ready','settings','error','stopped'].includes(s.phase);$('retry').hidden=s.phase!=='error';if(s.phase==='ready'){$('workbench').hidden=false;$('welcome').hidden=true;if(frameGeneration!==s.generation){$('workbench').src=s.backend_url;frameGeneration=s.generation;}}else{$('workbench').hidden=true;$('welcome').hidden=false;}if(s.phase==='settings'&&lastPhase!==s.phase)showSettings();if(s.phase==='ready'&&s.generation>applyFromGeneration&&$('save-message').dataset.applying==='true'){$('settings').hidden=true;$('save-message').dataset.applying='';$('save-message').textContent='设置已生效，本地服务已就绪。';}lastPhase=s.phase;window.desktopState={phase:s.phase,api_ready:s.api_ready,generation:s.generation};}
async function poll(){if(!api||polling)return;polling=true;try{render(await api.get_status())}catch{$('top-status').textContent='正在连接桌面服务'}finally{polling=false}}
$('open-settings').onclick=showSettings;$('boot-settings').onclick=showSettings;$('close-settings').onclick=()=>{$('settings').hidden=true};$('retry').onclick=()=>api.retry();$('open-data').onclick=()=>api.open_data_directory();
document.querySelectorAll('[data-browse]').forEach(button=>button.onclick=async()=>{const p=await api.choose_folder(button.dataset.browse);if(p)$(button.dataset.browse==='model_directory'?'model-directory':'git-directory').value=p;});
$('settings-form').onsubmit=async event=>{
  event.preventDefault();if(!settingsLoaded)return;lockInputs(true);
  const generation=frameGeneration;
  const draft={model_directory:$('model-directory').value,git_directory:$('git-directory').value,api_base:$('api-base').value,api_model:$('api-model').value,api_key:$('api-key').value,clear_key:$('clear-key').checked,hyde_enabled:$('hyde-enabled').checked,rerank_enabled:$('rerank-enabled').checked};
  try{
    const result=await api.save_settings(draft);
    if(result.ok){
      fillSettings(result.settings);$('save-message').className='message';
      $('save-message').textContent=result.changed===false?'设置未变化，无需重复保存。':'已保存，正在重启本地服务；请等待就绪后再提问。';
      if(result.changed!==false){applyFromGeneration=generation;$('save-message').dataset.applying='true';await poll();}
    }else{$('save-message').textContent=result.message;$('save-message').className='message error-message';$('save-message').dataset.applying='';}
  }catch{$('save-message').textContent='保存结果无法确认，请返回后重新读取设置。';$('save-message').className='message error-message';}
  finally{lockInputs(false);}
};
window.addEventListener('pywebviewready',async()=>{api=window.pywebview.api;await loadSettings();await poll();setInterval(poll,500)});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('settings').hidden=true});
</script></body></html>
